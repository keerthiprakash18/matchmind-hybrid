name: Production Hybrid fallback audit (one live request)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hybrid-fallback-audit.yml

permissions:
  contents: read

jobs:
  real-fallback:
    name: Verify real Hybrid to Cloud route without local model
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Test on public HTTPS with real production App Check
        run: npx playwright test tests/production-fallback.spec.mjs --reporter=line --workers=1
      - name: Preserve real successful evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matchmind-real-hybrid-fallback-receipt
          path: hybrid-cloud-fallback-real-run.png
          retention-days: 7
          if-no-files-found: ignore
